<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="GitHub Actions and deployment status for NamTheDev repositories.">
  <title>Deployment status — NamTheDev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="dashboard/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="design/config.css">
  <script src="dashboard/theme.js"></script>
  <script type="module" src="dashboard/app.mjs"></script>
</head>
<body class="bg-body fg-body">
  <main class="container-fluid p-4 lg:p-6">
    <header class="d-flex flex-wrap align-items-center justify-content-between gap-3 border-bottom pb-4 mb-4">
      <div><h1 class="fs-xl fw-semibold mb-1">Deployment status</h1><a href="https://github.com/NamTheDev" class="fg-3 text-decoration-none">NamTheDev</a></div>
      <div class="d-flex flex-wrap gap-2">
        <button id="theme" type="button" class="btn btn-outline theme-secondary rounded-5">Light mode</button>
        <button id="refresh" type="button" class="btn btn-solid theme-primary rounded-5">Refresh</button>
      </div>
    </header>
    <section aria-label="Workflow summary" class="d-flex flex-wrap gap-3 mb-4">
      <div class="card bg-1 rounded-6 flex-grow-1"><div class="card-body"><div class="fg-3">Repositories</div><strong id="repos-count" class="fs-xl">—</strong></div></div>
      <div class="card bg-1 rounded-6 flex-grow-1"><div class="card-body"><div class="fg-3">Running</div><strong id="running-count" class="fs-xl fg-warning">—</strong></div></div>
      <div class="card bg-1 rounded-6 flex-grow-1"><div class="card-body"><div class="fg-3">Successful</div><strong id="success-count" class="fs-xl fg-success">—</strong></div></div>
      <div class="card bg-1 rounded-6 flex-grow-1"><div class="card-body"><div class="fg-3">Failed</div><strong id="failed-count" class="fs-xl fg-danger">—</strong></div></div>
    </section>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
      <label class="d-flex flex-wrap align-items-center gap-2">Show
        <select id="filter" class="form-control w-auto rounded-5">
          <option value="all">All repositories</option>
          <option value="active">Active repositories</option>
          <option value="deployments">Deployment workflows</option>
          <option value="running">Running workflows</option>
          <option value="failed">Failed workflows</option>
        </select>
      </label>
      <p id="rate" class="fg-3 fs-xs m-0"></p>
    </div>
    <p id="status" class="fg-3 fs-sm mb-3" role="status">Loading public repositories…</p>
    <section id="repositories" class="d-flex flex-column gap-3" aria-label="Repositories"></section>
    <noscript>JavaScript is required to retrieve GitHub workflow statuses.</noscript>
    <footer class="fg-3 fs-xs border-top mt-5 pt-3">Latest observed default-branch runs. Deployment labels are inferred from workflow names and paths; external deployments not reported to GitHub Actions are not included.</footer>
  </main>
</body>
</html>
