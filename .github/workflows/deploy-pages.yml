name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: util-pages
  cancel-in-progress: false

jobs:
  commit-format:
    uses: ./.github/workflows/commit-message-format.yml
  ai-disclosure:
    uses: ./.github/workflows/ai-disclosure-format.yml
  resources:
    uses: ./.github/workflows/resource-verification.yml
  build:
    needs: [commit-format, ai-disclosure, resources]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage dashboard assets
        run: |
          mkdir -p _site/dashboard/vendor _site/design
          cp index.html .nojekyll _site/
          cp dashboard/theme.js dashboard/model.mjs dashboard/app.mjs _site/dashboard/
          cp dashboard/vendor/bootstrap.min.css dashboard/vendor/LICENSE.bootstrap _site/dashboard/vendor/
          cp design/config.css _site/design/
          test -s _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
